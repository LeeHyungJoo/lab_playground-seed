name: Daily AI & Code
on:
  schedule:
    - cron: '0 21 * * *' # 06:00 Asia/Seoul, following day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/daily-post.mjs'
      - '.github/workflows/daily-post.yml'
permissions:
  contents: write
  models: read
concurrency:
  group: daily-ai-code
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select and summarize one repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/daily-post.mjs
      - name: Save post
        run: |
          git config user.name 'morning-code-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/posts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'content: daily AI and code briefing'
          git push
