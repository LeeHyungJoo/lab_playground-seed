name: Manual development recovery
on:
  # Kept only for explicit development recovery; the cloud task is the sole daily generator.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jininsa-publication-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Read latest posts when a queued recovery run starts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether today's post already exists
        id: daily
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { dayInSeoul, hasDailyPost } from './scripts/daily-post.mjs';
          const posts=JSON.parse(readFileSync('docs/data/posts.json','utf8'));
          const exists=hasDailyPost(posts);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Korea date: ${dayInSeoul()}\nDaily post already exists: ${exists}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT,`exists=${exists}\n`);
          JS
      - uses: actions/setup-python@v5
        if: steps.daily.outputs.exists == 'false' && env.OPENAI_API_KEY == ''
        with:
          python-version: '3.11'
      - name: Cache public model weights
        if: steps.daily.outputs.exists == 'false' && env.OPENAI_API_KEY == ''
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: qwen3-1.7b-70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
      - name: Install CPU inference dependencies
        if: steps.daily.outputs.exists == 'false' && env.OPENAI_API_KEY == ''
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements-ai.txt
      - name: Test publishing rules
        run: node --test scripts/*.test.mjs
      - name: Select and summarize one repository
        if: steps.daily.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/daily-post.mjs
      - name: Save post
        if: steps.daily.outputs.exists == 'false'
        run: |
          git config user.name 'morning-code-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/posts.json docs/data/publication-state.json content/inbox
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'content: daily AI and code briefing'
          git push
